name: Build Mastercrafted repository

on:
  push:
    paths:
      - '.build-ready'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat .build-parts/part-* > /tmp/mastercrafted.b64
          base64 --decode /tmp/mastercrafted.b64 > /tmp/mastercrafted-repo.tar.xz
          xz -t /tmp/mastercrafted-repo.tar.xz
          tar -xJf /tmp/mastercrafted-repo.tar.xz -C "$GITHUB_WORKSPACE"

      - name: Commit finished module
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git rm -r .build-parts .build-ready .github/workflows/build-mastercrafted.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Добавить рабочую сборку Mastercrafted"
          git push
